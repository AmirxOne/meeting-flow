name: meetinghub

# Dev (local Next.js):  docker compose up -d postgres redis
#                       pnpm dev  +  pnpm worker:dev  (worker جدا — یادآورها بدون آن ارسال نمی‌شوند)
# Full stack (prod-like): docker compose up -d  → app + postgres + redis + worker

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: meetinghub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meetinghub}
      POSTGRES_DB: meetinghub
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meetinghub -d meetinghub"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://meetinghub:${POSTGRES_PASSWORD:-meetinghub}@postgres:5432/meetinghub?schema=public
      REDIS_URL: redis://redis:6379
      RUN_MIGRATIONS: "true"
    ports:
      - "${APP_PORT:-3100}:3100"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      ROLE: worker
      DATABASE_URL: postgresql://meetinghub:${POSTGRES_PASSWORD:-meetinghub}@postgres:5432/meetinghub?schema=public
      REDIS_URL: redis://redis:6379
    command: ["node", "worker/index.js"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
