name: meetinghub

# Dev (local Next.js):  docker compose up -d postgres redis
#                       pnpm dev  +  pnpm worker:dev  (worker جدا — یادآورها بدون آن ارسال نمی‌شوند)
# Full stack (prod-like): docker compose up -d  → app + postgres + redis + worker
# On-prem production:     cp .env.production.example .env && docker compose -f docker-compose.prod.yml up -d --build

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: meetinghub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meetinghub}
      POSTGRES_DB: meetinghub
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meetinghub -d meetinghub"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://meetinghub:${POSTGRES_PASSWORD:-meetinghub}@postgres:5432/meetinghub?schema=public
      REDIS_URL: redis://redis:6379
      RUN_MIGRATIONS: "true"
    ports:
      - "${APP_PORT:-3100}:3100"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3100/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      ROLE: worker
      DATABASE_URL: postgresql://meetinghub:${POSTGRES_PASSWORD:-meetinghub}@postgres:5432/meetinghub?schema=public
      REDIS_URL: redis://redis:6379
    command: ["/app/docker/entrypoint-worker.sh"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3101/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
